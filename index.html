<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>مجمع مصائب أهل البيت</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box} body{margin:0;background:#111827;color:#f9fafb;font-family:system-ui,-apple-system,"Noto Naskh Arabic",sans-serif}
header{position:sticky;top:0;z-index:5;background:#111827;padding:10px 12px;display:flex;gap:8px;align-items:center}
h1{font-size:18px;margin:0;flex:1}.btn{border:0;border-radius:12px;padding:9px 12px;background:#374151;color:white;font-size:14px}
main{padding:12px}.panel{background:#1f2937;border-radius:16px;padding:12px;margin-bottom:12px}
select,input{width:100%;padding:12px;border-radius:12px;border:1px solid #4b5563;background:#111827;color:white;margin:5px 0;font-size:15px}
.row{display:flex;gap:8px}.row>*{flex:1}
#viewer{background:#374151;border-radius:16px;min-height:65vh;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:pan-y}
canvas{max-width:100%;height:auto;display:block}
#note{min-height:90px}.small{font-size:12px;color:#cbd5e1}.status{margin-top:7px;color:#d1d5db;font-size:13px}
</style>
</head>
<body>
<header>
<button class="btn" onclick="togglePanel()">☰</button>
<h1>مجمع مصائب أهل البيت</h1>
<button class="btn" onclick="zoom(-.15)">−</button>
<button class="btn" onclick="zoom(.15)">+</button>
</header>
<main>
<section id="panel" class="panel">
<select id="book" onchange="loadBook()">
<option value="1">الجزء الأول</option><option value="2">الجزء الثاني</option>
<option value="3">الجزء الثالث</option><option value="4">الجزء الرابع</option>
</select>
<div class="row">
<input id="page" type="number" min="1" value="1" placeholder="رقم الصفحة">
<button class="btn" onclick="goPage()">اذهب</button>
</div>
<input id="search" placeholder="بحث بالكلمة (إذا كان PDF يحتوي نصاً)" onkeydown="if(event.key==='Enter') searchPdf()">
<button class="btn" style="width:100%;margin-top:5px" onclick="searchPdf()">🔎 بحث</button>
<div class="small">ملاحظة: النسخ المرفوعة هنا صور PDF؛ إذا كانت الصفحات صوراً فقط فلن يظهر بحث الكلمات إلى أن نعمل OCR لها.</div>
<textarea id="note" placeholder="اكتب ملاحظة تحفظها على جهازك"></textarea>
<button class="btn" style="width:100%" onclick="saveNote()">💾 حفظ الملاحظة</button>
<div id="status" class="status"></div>
</section>
<div id="viewer"><canvas id="pdfCanvas"></canvas></div>
<div class="row" style="margin-top:10px">
<button class="btn" onclick="prevPage()">السابق</button>
<button class="btn" onclick="nextPage()">التالي</button>
</div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script>
<script type="module">
const pdfjs = await import("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs");
pdfjs.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";
window.pdfjs=pdfjs;
let pdf=null, pageNum=1, scale=1.15, startX=0;
const files={1:"books/الجزء-1.pdf",2:"books/الجزء-2.pdf",3:"books/الجزء-3.pdf",4:"books/الجزء-4.pdf"};
async function render(){
 if(!pdf)return;
 const p=await pdf.getPage(pageNum), viewport=p.getViewport({scale});
 const c=document.getElementById("pdfCanvas"), ctx=c.getContext("2d");
 c.width=viewport.width;c.height=viewport.height;
 await p.render({canvasContext:ctx,viewport}).promise;
 document.getElementById("page").value=pageNum;
 document.getElementById("status").textContent=`الصفحة ${pageNum} من ${pdf.numPages}`;
}
window.loadBook=async()=>{const n=document.getElementById("book").value;pageNum=1;pdf=await pdfjs.getDocument(files[n]).promise;render()};
window.goPage=()=>{let n=Math.max(1,Math.min(pdf?.numPages||1,Number(document.getElementById("page").value)||1));pageNum=n;render()};
window.nextPage=()=>{if(pdf&&pageNum<pdf.numPages){pageNum++;render()}};
window.prevPage=()=>{if(pdf&&pageNum>1){pageNum--;render()}};
window.zoom=(d)=>{scale=Math.max(.5,Math.min(3,scale+d));render()};
window.togglePanel=()=>{const p=document.getElementById("panel");p.hidden=!p.hidden};
window.saveNote=()=>{localStorage.setItem("majma_note",document.getElementById("note").value);alert("تم حفظ الملاحظة على الجهاز")};
document.getElementById("note").value=localStorage.getItem("majma_note")||"";
const v=document.getElementById("viewer");
v.addEventListener("touchstart",e=>startX=e.changedTouches[0].screenX,{passive:true});
v.addEventListener("touchend",e=>{const dx=e.changedTouches[0].screenX-startX;if(Math.abs(dx)>70){dx<0?nextPage():prevPage()}},{passive:true});
window.searchPdf=async()=>{
 const q=document.getElementById("search").value.trim();
 if(!q||!pdf)return;
 document.getElementById("status").textContent="جاري البحث في نص PDF...";
 for(let i=1;i<=pdf.numPages;i++){
   const p=await pdf.getPage(i), tc=await p.getTextContent();
   const t=tc.items.map(x=>x.str).join(" ");
   if(t.includes(q)){pageNum=i;await render();return}
 }
 document.getElementById("status").textContent="لم أجد الكلمة. إذا كانت الصفحات صوراً، نحتاج OCR للبحث.";
};
loadBook();
</script>
</body></html>
